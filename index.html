<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>대한민국 거주·숙박·방문 지도</title>
<style>
:root {
  --ink:#20332d; --muted:#697872; --line:#dce4df; --paper:#f3f6f3;
  --surface:#fff; --land:#fafcf9; --home:#75c6a3; --stay:#f1bd70; --visit:#86a8e9;
  --home-dark:#32845f; --stay-dark:#a76d16; --visit-dark:#456fb8;
  font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:var(--ink); background:var(--paper);
}
* { box-sizing:border-box; }
html,body { width:100%; height:100%; }
body { margin:0; min-width:320px; overflow:hidden; }
button,input { font:inherit; }
.app { height:100vh; min-height:0; overflow:hidden; display:grid; grid-template-rows:74px minmax(0,1fr); }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:baseline; gap:13px; min-width:0; }
h1 { font-size:20px; line-height:1.2; margin:0; letter-spacing:-.04em; white-space:nowrap; }
.tagline { color:var(--muted); font-size:13px; }
.top-actions { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:7px; margin-left:auto; }
.download-button { border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); padding:7px 10px; font-size:11px; cursor:pointer; white-space:nowrap; }
.download-button:hover { background:#f0f5f1; border-color:#b9c9bf; }
.save-state { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; white-space:nowrap; }
.save-dot { width:7px; height:7px; border-radius:50%; background:#49a477; }
main { height:100%; min-height:0; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) 366px; gap:14px; padding:14px; }
.map-panel,.side-panel { height:100%; background:var(--surface); border:1px solid var(--line); border-radius:14px; min-width:0; min-height:0; }
.map-panel { display:flex; flex-direction:column; overflow:hidden; }
.map-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 18px 10px; }
.map-heading { margin:0; font-size:14px; font-weight:600; }
.map-hint { margin:4px 0 0; color:var(--muted); font-size:11px; }
.counts { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; color:var(--muted); }
.count { min-width:104px; display:grid; grid-template-columns:9px minmax(0,1fr) auto; align-items:center; gap:7px; padding:6px 8px; border:1px solid var(--line); border-radius:9px; background:#fbfcfb; }
.count-copy { display:flex; flex-direction:column; gap:2px; white-space:nowrap; }
.count-name { color:var(--ink); font-size:10px; font-weight:600; }
.count-detail { color:var(--muted); font-size:9px; }
.count-number { color:var(--ink); font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
.swatch { width:9px; height:9px; border-radius:3px; background:var(--c); }
.map-tools { display:flex; align-items:center; gap:4px; margin-left:12px; }
.map-tool { width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); font-size:16px; cursor:pointer; }
.map-tool:hover { background:#f0f5f1; border-color:#b9c9bf; }
.map-wrap { flex:1; min-height:360px; display:grid; place-items:center; overflow:hidden; padding:0 12px 12px; }
#map { display:block; width:100%; height:100%; min-height:360px; }
.land { fill:var(--land); fill-rule:evenodd; stroke:#64736c; stroke-width:.8; stroke-linejoin:round; vector-effect:non-scaling-stroke; cursor:pointer; transition:fill .16s ease,stroke .16s ease; }
.land:hover,.land.is-active { stroke:#152923; stroke-width:1.7; }
.province-border { fill:none; stroke:#31453b; stroke-width:2.2; stroke-linejoin:round; vector-effect:non-scaling-stroke; pointer-events:none; }
.inset-frame { fill:none; stroke:#465c50; stroke-width:1.8; stroke-dasharray:5 3; vector-effect:non-scaling-stroke; pointer-events:none; }
.place-label { fill:#263832; text-anchor:middle; dominant-baseline:central; pointer-events:none; font-weight:500; }
.side-panel { display:flex; flex-direction:column; overflow:hidden; }
.side-head { padding:17px 16px 12px; border-bottom:1px solid var(--line); }
.side-title-row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.side-title { margin:0; font-size:16px; font-weight:600; }
.region-count { color:var(--muted); font-size:11px; }
.reset-button { border:1px solid #e0c7c3; border-radius:7px; background:#fff9f8; color:#98584f; padding:5px 9px; font-size:11px; cursor:pointer; }
.reset-button:hover { background:#fff0ed; }
.search { width:100%; height:38px; margin-top:13px; border:1px solid var(--line); border-radius:8px; padding:0 11px; color:var(--ink); background:#fbfcfb; outline:none; }
.search:focus { border-color:#7ba891; box-shadow:0 0 0 3px #75c6a322; }
.list-head,.region-row { display:grid; grid-template-columns:minmax(82px,1fr) repeat(4,43px); align-items:center; }
.list-head { padding:10px 12px 8px 16px; color:var(--muted); font-size:10px; text-align:center; }
.list-head span:first-child { text-align:left; }
.list-head .home { color:var(--home-dark); } .list-head .stay { color:var(--stay-dark); } .list-head .visit { color:var(--visit-dark); } .list-head .short { color:#8d4b87; }
.region-list { min-height:0; flex:1; overflow:auto; overscroll-behavior:contain; padding:0 8px 8px; scrollbar-color:#c8d1cc transparent; scrollbar-width:thin; }
.province-group { margin:2px 0; border-radius:8px; }
.province-group[open] { background:#f7faf8; }
.province-group summary { min-height:42px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 10px; border-radius:8px; cursor:pointer; list-style:none; font-size:13px; font-weight:600; }
.province-group summary::-webkit-details-marker { display:none; }
.province-group summary::before { content:""; width:7px; height:7px; flex:0 0 7px; margin-right:2px; border-right:1.5px solid #74847c; border-bottom:1.5px solid #74847c; transform:rotate(-45deg); transition:transform .15s ease; }
.province-group[open] summary::before { transform:rotate(45deg); }
.group-name { flex:1; }
.group-meta { color:var(--muted); font-size:10px; font-weight:400; white-space:nowrap; }
.group-items { padding:0 4px 6px 8px; }
.fixed-group { margin:2px 0; padding-bottom:4px; border-radius:8px; background:#f7faf8; }
.fixed-group-title { min-height:42px; display:flex; align-items:center; padding:0 10px; font-size:13px; font-weight:600; }
.region-row { min-height:42px; border-radius:7px; padding:0 4px 0 8px; transition:background .12s ease; }
.region-row:hover,.region-row.is-active { background:#edf4ef; }
.region-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-right:5px; font-size:12px; }
.check-cell { min-height:42px; display:grid; place-items:center; cursor:pointer; }
.check-cell input { width:17px; height:17px; margin:0; accent-color:var(--accent); cursor:pointer; }
.check-cell:focus-within { outline:2px solid #94b8a5; outline-offset:-2px; border-radius:6px; }
.empty { padding:20px 12px; color:var(--muted); text-align:center; font-size:12px; }
.side-foot { padding:10px 15px 12px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; line-height:1.5; }
@media (max-width:850px) {
  html,body { height:auto; } body { overflow:auto; }
  .app { display:block; height:auto; min-height:100vh; overflow:visible; } .topbar { min-height:68px; padding:12px 16px; flex-wrap:wrap; }
  .brand { display:block; } h1 { font-size:17px; } .tagline { display:block; margin-top:4px; font-size:11px; }
  main { height:auto; overflow:visible; display:flex; flex-direction:column; padding:10px; gap:10px; }
  .map-panel { min-height:66vh; } .map-head { display:block; } .counts { justify-content:flex-start; margin-top:9px; }
  .map-wrap { min-height:52vh; } #map { min-height:52vh; } .side-panel { height:58vh; min-height:380px; }
}
@media (max-width:420px) {
  .topbar { gap:8px; } .top-actions { width:100%; justify-content:flex-start; } .save-state { font-size:10px; } .side-head { padding:14px 12px 10px; }
  .list-head,.region-row { grid-template-columns:minmax(62px,1fr) repeat(4,37px); } .region-list { padding-inline:5px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><h1>대한민국 나의 지도</h1><span class="tagline">살고, 묵고, 걸었던 곳을 기록해 보세요</span></div>
    <div class="top-actions"><button class="download-button" id="save-image" type="button">이미지 저장</button><button class="download-button" id="save-json" type="button">JSON 저장</button><button class="download-button" id="load-json" type="button">JSON 불러오기</button><input id="load-json-file" type="file" accept=".json,application/json" hidden><div class="save-state" title="기록은 현재 기기의 브라우저에 저장됩니다"><span class="save-dot" aria-hidden="true"></span><span id="save-message">이 기기에 자동 저장</span></div></div>
  </header>
  <main>
    <section class="map-panel" aria-label="대한민국 지도">
      <div class="map-head">
        <div><h2 class="map-heading">시·군별 기록</h2><p class="map-hint">지역을 펼쳐 체크하면 지도 색이 바로 바뀝니다. 복수 선택은 색을 나누어 표시합니다.</p></div>
        <div style="display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap"><div class="counts" id="counts" aria-live="polite"></div><div class="map-tools" aria-label="지도 확대·축소"><button class="map-tool" id="zoom-in" type="button" aria-label="확대" title="확대">+</button><button class="map-tool" id="zoom-out" type="button" aria-label="축소" title="축소">−</button><button class="map-tool" id="zoom-reset" type="button" aria-label="확대 초기화" title="전체 지도 보기">↺</button></div></div>
      </div>
      <div class="map-wrap"><svg id="map" viewBox="0 0 900 900" role="img" aria-label="거주, 숙박, 방문 기록을 색으로 표시하는 대한민국 시·군 지도"></svg></div>
    </section>
    <aside class="side-panel" aria-label="시·도별 지역 기록">
      <div class="side-head">
        <div class="side-title-row"><h2 class="side-title">지역 기록</h2><span class="region-count">163개 시·군</span><button class="reset-button" id="reset-button" type="button">초기화</button></div>
        <input class="search" id="search" type="search" autocomplete="off" placeholder="시·군 이름 검색" aria-label="시·군 이름 검색">
      </div>
      <div class="list-head"><span>지역</span><span class="home" title="거주 · 1달 이상">거주</span><span class="stay" title="숙박 · 1박 이상">숙박</span><span class="visit" title="방문 · 반나절 이상">방문</span><span class="short" title="잠시 머뭄 · 반나절 이하">잠시</span></div>
      <div class="region-list" id="region-list" role="group" aria-label="시·도별 시·군 체크 목록"></div>
      <div class="side-foot">시·도 이름을 눌러 목록을 열고 시·군을 체크하세요. 기록은 이 기기의 브라우저에 자동 저장되며 다른 기기와는 동기화되지 않습니다.</div>
    </aside>
  </main>
</div>

        if(id===activeId) row.classList.add('is-active');
        const name=document.createElement('span'); name.className='region-name'; name.textContent=d.properties.label; row.append(name);
        for(const status of statuses) {
          const cell=document.createElement('label'); cell.className='check-cell'; cell.style.setProperty('--accent',status.dark);
          const check=document.createElement('input'); check.type='checkbox'; check.checked=!!(records[id]&&records[id][status.id]);
          check.dataset.regionId=id; check.dataset.statusId=status.id;
          check.setAttribute('aria-label',`${d.properties.label} ${status.name} (${status.detail})`);
          check.title=`${d.properties.label} · ${status.name} (${status.detail})`;
          cell.append(check); row.append(cell);
        }
        row.addEventListener('click',event=>{if(!(event.target instanceof HTMLInputElement)) selectRegion(d);});
        rows.append(row);
      }
      container.append(rows); list.append(container);
    }
    if(!filtered.length) {const empty=document.createElement('div');empty.className='empty';empty.textContent='검색 결과가 없습니다.';list.append(empty);}
    updateGroupCounts();
  }
  function fillFor(id) {
    const chosen=statuses.filter(s=>records[id]&&records[id][s.id]);
    if(!chosen.length) return '#fafcf9';
    if(chosen.length===1) return chosen[0].color;
    return `url(#mix-${chosen.map(s=>s.id).join('-')})`;
  }
  function updateMap() {
    regions.style('fill',d=>fillFor(d.properties.id)).attr('aria-pressed',d=>d.properties.id===activeId?'true':'false')
      .classed('is-active',d=>d.properties.id===activeId);
  }
  function updateCounts() {
    document.getElementById('counts').innerHTML=statuses.map(s=>{
      const n=areas.features.reduce((sum,d)=>sum+(records[d.properties.id]&&records[d.properties.id][s.id]?1:0),0);
      return `<span class="count"><i class="swatch" style="--c:${s.color}"></i><span class="count-copy"><span class="count-name">${s.name}</span><span class="count-detail">${s.detail}</span></span><span class="count-number">${n}</span></span>`;
    }).join('');
    updateGroupCounts();
  }
  function updateGroupCounts() {
    list.querySelectorAll('[data-group-meta]').forEach(el=>{
      const group=el.dataset.groupMeta;
      const items=areas.features.filter(d=>listGroup(d)===group);
      el.textContent=items.filter(d=>hasRecord(d.properties.id)).length+' / '+items.length+' 기록';
    });
  }
  function save() {
    try {localStorage.setItem(storageKey,JSON.stringify(records));}
    catch {document.getElementById('save-message').textContent='브라우저 저장을 사용할 수 없습니다';}
  }
  function downloadBlob(blob,filename) {
    const url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url; link.download=filename; document.body.append(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function fileDate() {return new Date().toISOString().slice(0,10);}
  function saveJSON() {
    const exportedRecords={};
    for(const d of areas.features) {
      const id=d.properties.id,value=records[id];
      if(value&&statuses.some(s=>value[s.id])) exportedRecords[id]={...value};
    }
    const data={
      format:'korea-trip-map',version:1,exportedAt:new Date().toISOString(),
      statuses:statuses.map(({id,name,detail,color})=>({id,name,detail,color})),
      regions:areas.features.map(d=>({id:d.properties.id,name:d.properties.name,label:d.properties.label,group:listGroup(d)})),
      records:exportedRecords
    };
    downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),`korea-trip-map-${fileDate()}.json`);
  }
  function saveImage() {
    const namespace='http://www.w3.org/2000/svg',source=document.getElementById('map');
    const clone=source.cloneNode(true),size=2700;
    clone.setAttribute('xmlns',namespace); clone.setAttribute('width',size); clone.setAttribute('height',size);
    const exportLayer=clone.querySelector('.map-layer');
    if(exportLayer) exportLayer.removeAttribute('transform');
    const style=document.createElementNS(namespace,'style');
    style.textContent='.land{fill:#fafcf9;fill-rule:evenodd;stroke:#64736c;stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}.land.is-active{stroke:#152923;stroke-width:1.7}.place-label{fill:#263832;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-weight:500;font-family:Malgun Gothic,Apple SD Gothic Neo,sans-serif}.province-border{fill:none;stroke:#31453b;stroke-width:2.2;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}.inset-frame{fill:none;stroke:#465c50;stroke-width:1.8;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;pointer-events:none}';
    clone.insertBefore(style,clone.firstChild);
    const background=document.createElementNS(namespace,'rect');
    background.setAttribute('width','100%'); background.setAttribute('height','100%'); background.setAttribute('fill','#ffffff');
    clone.insertBefore(background,style.nextSibling);
    const svgBlob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(svgBlob),image=new Image();
    image.onload=()=>{
      const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
      const context=canvas.getContext('2d'); context.fillStyle='#ffffff'; context.fillRect(0,0,size,size);
      context.drawImage(image,0,0,size,size); URL.revokeObjectURL(url);
      canvas.toBlob(blob=>{if(blob) downloadBlob(blob,`korea-trip-map-${fileDate()}.png`);},'image/png');
    };
    image.onerror=()=>{URL.revokeObjectURL(url);document.getElementById('save-message').textContent='이미지 저장에 실패했습니다';};
    image.src=url;
  }
  function selectRegion(d) {
    activeId=d.properties.id; updateMap();
    list.querySelectorAll('.region-row').forEach(el=>el.classList.toggle('is-active',el.dataset.regionId===activeId));
    const group=list.querySelector(`[data-group="${CSS.escape(listGroup(d))}"]`);
    if(group && group.tagName==='DETAILS' && !group.open) {
      group.dataset.focusRegion=activeId;
      group.open=true;
    }
    const row=[...list.querySelectorAll('.region-row')].find(el=>el.dataset.regionId===activeId);
    if(row && !(group && group.dataset.focusRegion)) row.scrollIntoView({block:'start',inline:'nearest',behavior:'smooth'});
  }
  list.addEventListener('change',event=>{
    const input=event.target;
    if(!(input instanceof HTMLInputElement)||!input.dataset.statusId) return;
    const id=input.dataset.regionId,statusId=input.dataset.statusId;
    if(!records[id]) records[id]={};
    records[id][statusId]=input.checked;
    if(!Object.values(records[id]).some(Boolean)) delete records[id];
    save(); updateMap(); updateCounts();
  });
  search.addEventListener('input',()=>renderList(search.value));
  document.getElementById('save-image').addEventListener('click',saveImage);
  document.getElementById('save-json').addEventListener('click',saveJSON);
  const importFile=document.getElementById('load-json-file');
  document.getElementById('load-json').addEventListener('click',()=>importFile.click());
  importFile.addEventListener('change',async()=>{
    const file=importFile.files&&importFile.files[0];
    if(!file) return;
    try {
      const data=JSON.parse(await file.text());
      if(!data||data.format!=='korea-trip-map'||!data.records||typeof data.records!=='object'||Array.isArray(data.records))
        throw new Error('지원하지 않는 JSON 형식입니다.');
      const restored={};
      for(const [id,value] of Object.entries(data.records)) {
        if(!known.has(id)||!value||typeof value!=='object'||Array.isArray(value)) continue;
        const state=Object.fromEntries(statuses.map(status=>[status.id,value[status.id]===true]));
        if(Object.values(state).some(Boolean)) restored[id]=state;
      }
      if(!window.confirm('현재 기록을 이 JSON 파일의 기록으로 바꿀까요?')) return;
      records=restored; activeId=null; save(); renderList(search.value); updateMap(); updateCounts();
      document.getElementById('save-message').textContent='JSON 기록을 불러왔습니다';
    } catch {
      window.alert('JSON 파일을 읽지 못했습니다. 이 지도에서 저장한 JSON인지 확인해 주세요.');
    } finally { importFile.value=''; }
  });
  document.getElementById('reset-button').addEventListener('click',()=>{
    if(!window.confirm('거주·숙박·방문 기록을 모두 초기화할까요?')) return;
    records={}; activeId=null;
    try {localStorage.removeItem(storageKey);} catch {}
    renderList(search.value); updateMap(); updateCounts();
    document.getElementById('save-message').textContent='기록이 초기화되었습니다';
  });
  renderList(); updateMap(); updateCounts();
})();
</script>
</body>
</html>
